services:
  - type: web
    name: django-saas-starter
    env: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: django-saas-db
          property: connectionString

databases:
  - name: django-saas-db
    plan: starter
