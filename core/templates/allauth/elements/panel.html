{% load allauth %}
<div class="card mb-3">
  {% if slots.title %}
    <div class="card-header">
      {% slot title %}{% endslot %}
    </div>
  {% endif %}
  <div class="card-body">
    {% slot body %}{% endslot %}
  </div>
  {% if slots.actions %}
    <div class="card-footer d-flex gap-2 flex-wrap">
      {% for action in slots.actions %}{{ action }}{% endfor %}
    </div>
  {% endif %}
</div>
