{% load allauth %}
<form method="{{ attrs.method }}"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}
      class="d-grid gap-3">
  {% slot body %}{% endslot %}
  {% if slots.actions %}
    <div class="d-flex gap-2 flex-wrap">{% slot actions %}{% endslot %}</div>
  {% endif %}
</form>
