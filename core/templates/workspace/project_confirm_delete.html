{% extends "_base_app.html" %}

{% block title %}Delete {{ object.name }} | {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 820px;">
  <div class="card-body">
    <h1 class="h5 fw-semibold mb-2">Delete project</h1>
    <p class="text-body-secondary mb-3">This action cannot be undone.</p>

    <div class="alert alert-warning">
      You’re about to delete <strong>{{ object.name }}</strong>.
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button class="btn btn-danger" type="submit">Delete</button>
        <a class="btn btn-outline-secondary" href="{% url 'workspace:project_detail' object.pk %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
