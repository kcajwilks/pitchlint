{% extends "_base_root.html" %}

{% block layout %}
<nav class="navbar navbar-expand-lg bg-body border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'home' %}">{{ SITE_NAME }}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#marketingNav" aria-controls="marketingNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="marketingNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'pricing' %}">Pricing</a></li>
        {% if user.is_authenticated %}
        <li class="nav-item"><a class="btn btn-primary btn-sm ms-lg-2" href="{% url 'dashboard:home' %}">Open app</a></li>
        {% else %}
        <li class="nav-item"><a class="nav-link" href="{% url 'account_login' %}">Log in</a></li>
        <li class="nav-item"><a class="btn btn-primary btn-sm ms-lg-2" href="{% url 'account_signup' %}">Start free</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  {% block content %}{% endblock %}
</main>

{% include "_partials/_footer.html" %}
{% endblock %}
