{% extends "_base_app.html" %}

{% block content %}
<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center mb-4 gap-2">
  <div>
    <h1 class="h4 fw-semibold mb-1">Settings</h1>
    <p class="text-body-secondary mb-0">Manage your account, security, and billing preferences.</p>
  </div>
</div>

<ul class="nav nav-pills mb-4 gap-2">
  <li class="nav-item">
    <a class="nav-link {% if settings_tab == 'profile' %}active{% endif %}" href="{% url 'settings:profile' %}">Profile</a>
  </li>
  <li class="nav-item">
    <a class="nav-link {% if settings_tab == 'account' %}active{% endif %}" href="{% url 'settings:account' %}">Account & Security</a>
  </li>
  <li class="nav-item">
    <a class="nav-link {% if settings_tab == 'billing' %}active{% endif %}" href="{% url 'settings:billing' %}">Billing</a>
  </li>
</ul>

{% block settings_content %}{% endblock %}
{% endblock %}
