{% extends "settings/_layout.html" %}

{% block title %}Delete account | {{ SITE_NAME }}{% endblock %}

{% block settings_content %}
<div class="card border-danger">
  <div class="card-body">
    <h2 class="h6 text-danger">Delete account</h2>
    <p class="small text-body-secondary">This action is permanent and removes your account and related data.</p>
    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" class="d-grid gap-3">
      {% csrf_token %}
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="yes" id="confirmDelete" name="confirm_delete">
        <label class="form-check-label" for="confirmDelete">
          I understand this action cannot be undone.
        </label>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">Delete my account</button>
        <a href="{% url 'settings:account' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
