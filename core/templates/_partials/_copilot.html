{% load static %}

{% if COPILOT_ENABLED %}
  <link rel="stylesheet" href="{% static 'frontend/copilot.css' %}">
  <div class="card mt-3">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
        <h2 class="h6 fw-semibold mb-0">Copilot</h2>
        <button class="btn btn-sm btn-outline-secondary" type="button" data-copilot-reset>
          Reset conversation
        </button>
      </div>
      <div
        id="copilot-root"
        class="border rounded-2"
        style="min-height: 420px;"
        data-surface-key="{{ copilot_surface_key|default:'workspace_project_detail' }}"
        data-variant="{{ copilot_variant|default:'inline' }}"
        {% if copilot_project_id %}data-project-id="{{ copilot_project_id }}"{% endif %}
      ></div>
    </div>
  </div>

  <script src="{% static 'frontend/copilot.js' %}"></script>
{% endif %}
