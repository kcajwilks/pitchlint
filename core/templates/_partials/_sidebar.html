<aside class="app-sidebar">
  <div class="px-2 mb-4 d-flex align-items-center gap-2">
    <div class="rounded-2 bg-primary-subtle text-primary d-grid place-items-center" style="width: 32px; height: 32px;">
      <i class="bi bi-stars"></i>
    </div>
    <div class="brand-label fw-semibold">{{ SITE_NAME }}</div>
  </div>

  <div class="workspace-label px-2 py-2 mb-3 rounded-2 border bg-body-tertiary small text-body-secondary">
    Personal workspace
  </div>

  <nav class="nav flex-column">
    <a class="nav-link {% if active_nav == 'dashboard' %}active{% endif %}" href="{% url 'dashboard:home' %}">
      <i class="bi bi-grid me-2"></i><span class="link-label">Dashboard</span>
    </a>
    <a class="nav-link {% if active_nav == 'workspace' %}active{% endif %}" href="{% url 'workspace:project_list' %}">
      <i class="bi bi-robot me-2"></i><span class="link-label">Workspace</span>
    </a>
    <a class="nav-link {% if active_nav == 'settings' %}active{% endif %}" href="{% url 'settings:profile' %}">
      <i class="bi bi-gear me-2"></i><span class="link-label">Settings</span>
    </a>
    {% if COPILOT_ENABLED %}
    <div class="mt-3 mb-1 small text-body-secondary px-2">Copilot</div>
    <a class="nav-link {% if active_nav == 'copilot' %}active{% endif %}" href="{% url 'copilot:demo_inline' %}">
      <i class="bi bi-chat-left-text me-2"></i><span class="link-label">Copilot demos</span>
    </a>
    {% endif %}
  </nav>
</aside>
