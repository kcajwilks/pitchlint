<div class="dropdown">
  <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
    <i class="bi bi-person-circle me-1"></i>{{ user.email|default:user.username }}
  </button>
  <div class="dropdown-menu dropdown-menu-end p-3" style="min-width: 260px;">
    <div class="mb-3">
      <div class="fw-semibold">{{ user.username|default:user.email }}</div>
      <div class="small text-body-secondary">{{ user.email }}</div>
    </div>
    <div class="mb-3">
      <label class="form-label small text-body-secondary mb-1">Theme</label>
      {% include "_partials/_theme_toggle.html" %}
    </div>
    <div class="d-grid gap-2">
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'settings:profile' %}">Settings</a>
      <a class="btn btn-sm btn-outline-danger" href="{% url 'account_logout' %}">Log out</a>
    </div>
  </div>
</div>
